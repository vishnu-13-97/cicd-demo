name: Docker CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cicd-demo:test .

      - name: Run container
        run: docker run -d --name cicd-test -p 8000:8000 ${{ secrets.DOCKERHUB_USERNAME }}/cicd-demo:test

      - name: Run application test
        run: ./test.sh

      - name: Stop test container
        if: always()
        run: docker rm -f cicd-test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag image
        run: docker tag ${{ secrets.DOCKERHUB_USERNAME }}/cicd-demo:test ${{ secrets.DOCKERHUB_USERNAME }}/cicd-demo:latest

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/cicd-demo:latest
